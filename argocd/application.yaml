# GitOps: Argo CD watches this Git repo and keeps the cluster matching it.
# Apply once with: kubectl apply -n argocd -f argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: station-fuel-sales-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Ajoke29/station-fuel-sales-platform.git
    targetRevision: main
    path: helm/station-fuel-sales
    helm:
      releaseName: station-fuel-sales
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: fuel-sales-dev
  syncPolicy:
    automated:
      prune: true      # delete things that were removed from Git
      selfHeal: true   # undo manual changes made directly in the cluster
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
