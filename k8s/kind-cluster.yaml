# Local Kubernetes cluster for development: 1 control plane + 2 workers.
# Usage: kind create cluster --name fuel-sales --config k8s/kind-cluster.yaml
# The app's NodePort 30080 is published on your laptop as http://localhost:8080
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fuel-sales
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
  - role: worker
  - role: worker
