name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the build job asks for package write access itself
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  HADOLINT_VERSION: "2.15.1"
  YAMLLINT_VERSION: "1.38.0"
  HELM_VERSION: "v4.3.1"
  KUBECONFORM_VERSION: "v0.6.7"
  TERRAFORM_VERSION: "1.16.6"
  PROMETHEUS_VERSION: "3.15.0"
  TRIVY_VERSION: "0.76.1"

jobs:
  lint:
    name: Lint (Dockerfile, YAML, Helm, Terraform, alerts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: yamllint
        run: |
          pip install "yamllint==${YAMLLINT_VERSION}"
          yamllint -s .

      - name: hadolint
        run: |
          curl -fsSL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          chmod +x /usr/local/bin/hadolint
          hadolint app/Dockerfile

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: helm lint + template (dev and prod values)
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform
          for env in dev prod; do
            helm lint helm/station-fuel-sales -f "helm/station-fuel-sales/values-${env}.yaml"
            helm template sfs helm/station-fuel-sales -f "helm/station-fuel-sales/values-${env}.yaml" > "rendered-${env}.yaml"
            kubeconform -strict -summary -ignore-missing-schemas "rendered-${env}.yaml"
          done

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt + validate (no Azure login needed)
        working-directory: infra/terraform/azure
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: promtool check + unit test alert rules
        run: |
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          pip install pyyaml
          mkdir -p build
          python scripts/extract-rules.py monitoring/prometheus-rules.yaml build/rules.yaml
          promtool check rules build/rules.yaml
          promtool test rules monitoring/tests/alerts-test.yaml
          python -m json.tool monitoring/grafana-dashboard.json > /dev/null

  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v --junitxml=test-results.xml

  scan:
    name: Security scan (Trivy filesystem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Trivy
        run: |
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar xz -C /usr/local/bin trivy

      - name: Vulnerabilities and leaked secrets (fails the build)
        run: trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

      - name: Misconfiguration report (informational)
        run: trivy fs --scanners misconfig --severity HIGH,CRITICAL --exit-code 0 .

  build:
    name: Build image (push to GHCR on main)
    runs-on: ubuntu-latest
    needs: [lint, test, scan]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: app
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp -p 8080:8000 "${IMAGE}:${GITHUB_SHA}"
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/readyz && break; sleep 1; done
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/sales > /dev/null
          curl -fsS http://localhost:8080/metrics | grep -q fuel_sales_litres_sold
          docker rm -f smoke

      - name: Install Trivy
        run: |
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar xz -C /usr/local/bin trivy

      - name: Scan image (fails on fixable HIGH/CRITICAL)
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${IMAGE}:${GITHUB_SHA}"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:main"
