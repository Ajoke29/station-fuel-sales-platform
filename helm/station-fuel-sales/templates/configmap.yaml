apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sfs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sfs.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  SALES_SEED: {{ .Values.config.salesSeed | quote }}
  SALES_SAMPLE_DAYS: {{ .Values.config.salesSampleDays | quote }}
  SALES_END_DATE: {{ .Values.config.salesEndDate | quote }}
  CHAOS_ENABLED: {{ .Values.config.chaosEnabled | quote }}
  PORT: {{ .Values.containerPort | quote }}
